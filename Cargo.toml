[package]
name = "pythia"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
ractor = "0.15.10"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
reqwest = { version = "0.13.2", features = ["rustls"] }
scraper = "0.25.0"
fastembed = "5.11.0"
lancedb = "0.26.2"
arrow = "57.2"
futures = "0.3.32"
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
dotenvy = "0.15.7"
console-subscriber = "0.5.0"
rand = "0.10.0"
rusqlite = { version = "0.38.0", features = ["bundled"] }
bloomfilter = "3.0.1"

[dev-dependencies]
tempfile = "3.10.1"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.1"
criterion = { version = "0.8.2", features = ["async_tokio"] }
serde_urlencoded = "0.7.1"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 0
debug = 1

[[bench]]
name = "query"
harness = false

[[bench]]
name = "crawler"
harness = false

[[bench]]
name = "processor"
harness = false
