[workspace]
resolver = "2"
members = ["libs/*", "services/*"]

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3.32"
ractor = "0.15.10"
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls-webpki-roots",
  "json",
] }
scraper = "0.25.0"
url = "2.5.8"
rusqlite = { version = "0.38.0", features = ["bundled"] }
bloomfilter = "3.0.1"
uuid = { version = "1.22.0", features = ["v4"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
axum = "0.8.8"
headless_chrome = "1.0.21"
fastembed = "5.12.0"
quick-xml = "0.39.2"
lopdf = "0.39.0"
pdf-extract = "0.10.0"
lancedb = "0.26.2"
lance-index = "2.0.0"
arrow-array = "57.3.0"
arrow-schema = "57.3.0"
arrow-cast = "57.3.0"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
criterion = "0.8.2"
lapin = "4.2.1"

# Shared Internal Lib
shared = { path = "libs/shared" }
