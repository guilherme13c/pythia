apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pythia.fullname" . }}-crawler
  labels:
    {{- include "pythia.labels" . | nindent 4 }}
    {{- $comp := dict "component" "crawler" }}
    {{- include "pythia.selectorLabels" (merge $comp .) | nindent 4 }}
spec:
  serviceName: {{ include "pythia.fullname" . }}-crawler
  replicas: {{ .Values.crawler.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pythia.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: crawler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pythia.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: crawler
    spec:
      containers:
        - name: crawler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./crawler"]
          envFrom:
            - configMapRef:
                name: {{ include "pythia.fullname" . }}-config
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- with .Values.crawler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.crawler.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.crawler.storage.size }}
